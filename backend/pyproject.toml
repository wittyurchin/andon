[project]
name = "andon"
version = "0.1.0"
description = "Restaurant Situation Awareness System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.40",
    # Decodes radar tile PNGs (providers/radar/rainviewer.py).
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["andon*"]

[tool.setuptools.package-data]
# RainViewer's published dBZ colour table, read at runtime.
andon = ["providers/radar/*.csv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
